<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TicketBar - La Patrona</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="logo-icon">🎟️</span>
        <h2>Ticket<span>Bar</span> Admin</h2>
        <p>Panel de Control - La Patrona Disco Club</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuario Administrador:</label>
          <input type="text" id="usuario" placeholder="Ej: admin_patrona" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="......" required />
        </div>

        <button type="submit" class="btn-submit">INGRESAR AL PANEL</button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Volver al inicio de reservas</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
